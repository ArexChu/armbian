name: Build Armbian

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Armbian Image
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force Kernel version to 6.11.9
        run: |
          echo "==== Modifying sm8250.conf to use Kernel 6.11.9 ===="
          sed -i 's/KERNEL_MAJOR_MINOR="6.11"/KERNEL_MAJOR_MINOR="6.11"/g' config/sources/families/sm8250.conf
          sed -i "s/KERNELBRANCH='branch:linux-6.11.y'/KERNELBRANCH='tag:v6.11.9'/g" config/sources/families/sm8250.conf
          cat config/sources/families/sm8250.conf

      - name: Inject mkbootimg fix into Docker container
        run: |
          mkdir -p userpatches
          cat << 'EOF' > userpatches/lib.config
          echo "==== Applying mkbootimg fix inside Docker ===="
          if [ ! -d /usr/bin/gki ]; then
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
            cp /tmp/mkbootimg/mkbootimg.py /usr/bin/mkbootimg
            chmod +x /usr/bin/mkbootimg
            cp -r /tmp/mkbootimg/gki /usr/bin/
            echo "==== Fix applied! ===="
          fi
          EOF
          chmod +x userpatches/lib.config

      - name: Run Armbian Build Script
        run: |
          ./compile.sh \
            BOARD=oneplus-kebab \
            BRANCH=current \
            RELEASE=noble \
            BUILD_DESKTOP=yes \
            DESKTOP_ENVIRONMENT=gnome \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=minimal \
            DESKTOP_APPGROUPS_SELECTED=editors \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes \
            USE_REPO=no \
            REBUILD_KERNEL=yes \
            COMPRESS_OUTPUTIMAGE=xz
          
          echo "=== Build Output ==="
          ls -lh output || true
          ls -lh output/images || true
          ls -lh output/debs || true

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            output/images/*.img.xz
            output/debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
