name: Build Armbian

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Armbian Image
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inject mkbootimg fix into Docker container
        run: |
          mkdir -p userpatches
          cat << 'EOF' > userpatches/lib.config
          echo "==== Applying mkbootimg fix inside Docker ===="
          if [ ! -d /usr/bin/gki ]; then
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
            cp /tmp/mkbootimg/mkbootimg.py /usr/bin/mkbootimg
            chmod +x /usr/bin/mkbootimg
            cp -r /tmp/mkbootimg/gki /usr/bin/
            echo "==== Fix applied! ===="
          fi
          EOF
          chmod +x userpatches/lib.config

      - name: Fix firmware paths in kernel patch
        run: |
          PATCH_FILE="patch/kernel/archive/sm8250-6.19/0011-arm64-dts-qcom-sm8250-oneplus-kebab-Add-device-tree-.patch"
          if [ -f "$PATCH_FILE" ]; then
            echo "Modifying DTS firmware paths to match Armbian config..."
            sed -i 's|"postmarketos/adsp.mbn"|"qcom/sm8250/OnePlus/adsp.mbn"|g' "$PATCH_FILE"
            sed -i 's|"postmarketos/cdsp.mbn"|"qcom/sm8250/OnePlus/cdsp.mbn"|g' "$PATCH_FILE"
            sed -i 's|"postmarketos/slpi.mbn"|"qcom/sm8250/OnePlus/slpi.mbn"|g' "$PATCH_FILE"
            sed -i 's|"postmarketos/venus.mbn"|"qcom/sm8250/OnePlus/kebab/venus.mbn"|g' "$PATCH_FILE"
            echo "Patch file modified successfully."
          else
            echo "Error: $PATCH_FILE not found! Check your path."
          fi

      - name: Run Armbian Build Script
        run: |
          ./compile.sh \
            BOARD=oneplus-kebab \
            BRANCH=edge \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no
          
          echo "=== Build Output ==="
          ls -lh output
          ls -lh output/images
          ls -lh output/debs

      - name: Check and split larger images
        run: |
          mkdir -p release
          LIMIT=$((2 * 1024 * 1024 * 1024))
          for IMG in output/images/*.img; do
            echo "Checking: $IMG"
            SIZE=$(stat -c%s "$IMG")
            echo "Size: $SIZE bytes"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "Image larger, splitting..."
              split \
                -b 1900M \
                -d \
                --suffix-length=3 \
                "$IMG" \
                "release/$(basename "$IMG").part."
              rm -f "$IMG"
            else
              echo "Image smaller, copying..."
              cp "$IMG" release/
            fi
          done
          ls -lh release

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.img*
            output/debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
